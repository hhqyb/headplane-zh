apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headplane
  labels:
    app.kubernetes.io/name: headplane
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headplane
    spec:
      containers:
        - name: headplane
          image: ghcr.io/hhqyb/headplane-zh:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HEADPLANE_SERVER__HOST
              value: "0.0.0.0"
            - name: HEADPLANE_SERVER__PORT
              value: "3000"
            - name: HEADPLANE_SERVER__BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: headplane-config
                  key: base-path
            - name: HEADPLANE_SERVER__BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: headplane-config
                  key: base-url
            - name: HEADPLANE_SERVER__COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: headplane-config
                  key: cookie-secure
            - name: HEADPLANE_SERVER__DATA_PATH
              value: "/var/lib/headplane"
            - name: HEADPLANE_SERVER__COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: headplane-secrets
                  key: cookie-secret
            - name: HEADPLANE_HEADSCALE__URL
              valueFrom:
                configMapKeyRef:
                  name: headplane-config
                  key: headscale-url
            - name: HEADPLANE_HEADSCALE__PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: headplane-config
                  key: headscale-public-url
            - name: HEADPLANE_INTEGRATION__AGENT__ENABLED
              valueFrom:
                configMapKeyRef:
                  name: headplane-config
                  key: agent-enabled
            - name: HEADPLANE_HEADSCALE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: headplane-secrets
                  key: headscale-api-key
                  optional: true
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: data
              mountPath: /var/lib/headplane
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
